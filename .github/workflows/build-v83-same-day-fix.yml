    - name: Verify and apply v8.2 + v8.3 fixes
      shell: bash
      run: |
        python3 - <<'PY_PATCH'
        from pathlib import Path, PurePosixPath
        import base64,hashlib,io,zipfile
        raw=base64.b64decode(''.join(Path('/tmp/hw83-patch.b64').read_text().split()),validate=True)
        assert hashlib.sha256(raw).hexdigest()=='fb6e61b2157484f7a235db3613b74e67a454381503b4f415ce5b6403f6f227da', 'Patch digest mismatch'
        with zipfile.ZipFile(io.BytesIO(raw)) as z:
            for item in z.infolist():
                p=PurePosixPath(item.filename)
                if p.is_absolute() or '..' in p.parts or (p.parts and p.parts[0]=='.github'):
                    raise SystemExit('Unsafe patch path')
                target=Path(*p.parts)
                if item.is_dir():
                    target.mkdir(parents=True,exist_ok=True)
                else:
                    target.parent.mkdir(parents=True,exist_ok=True)
                    target.write_bytes(z.read(item))
        PY_PATCH
        python3 tools/finalize_v82.py
        python3 tools/finalize_v83.py
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Run schedule and same-day regression tests
      shell: bash
      run: |
        set -euo pipefail
        bash tools/test_schedule.sh
        bash tools/test_same_day.sh
        mkdir -p /tmp/launch-tests
        javac --release 8 -encoding UTF-8 -d /tmp/launch-tests HarmonyWake-source/app/src/main/java/com/oai/harmonywake/LaunchAttemptWindow.java tests/LaunchAttemptWindowTest.java
        java -cp /tmp/launch-tests com.oai.harmonywake.LaunchAttemptWindowTest
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install SDK
      run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.6.4
    - name: Build v8.3 APK
      shell: bash
      run: |
        set -euo pipefail
        gradle -p HarmonyWake-source assembleDebug --stacktrace 2>&1 | tee build-v83.log
    - name: Prepare installable artifact
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p deliverables
        cp HarmonyWake-source/app/build/outputs/apk/debug/app-debug.apk deliverables/HarmonyWake-v8.3-debug.apk
        cp README-V83-SAME-DAY.md deliverables/README.md
        (cd deliverables && sha256sum HarmonyWake-v8.3-debug.apk > SHA256SUMS.txt)
    - name: Upload APK
      uses: actions/upload-artifact@v4
