          python3 - <<'PY_PATCH'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, zipfile
          raw = base64.b64decode(''.join(Path('/tmp/hw82-fix.b64').read_text().split()), validate=True)
          if hashlib.sha256(raw).hexdigest() != '3200d182eb01ce344c4a0daf270f3c36d5080f51345fcf0d3cd9c0afd2ef84f4':
              raise SystemExit('Patch integrity check failed')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe patch path')
                  out = Path(*p.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(item))
          PY_PATCH
          python3 tools/finalize_v82.py

