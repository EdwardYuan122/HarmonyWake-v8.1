name: Build HarmonyWake v8.2 - Launch Confirmation Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-v82-launch-fix*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing v8.1 repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore verified v8.1 source from this repository
        shell: bash
        run: |
          python3 - <<'PY_RESTORE'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, re, zipfile
          expected = '7df17a0a094d3c2293b1405f0527e3a1845ba7260f9ab3309cd8f36b30c79f3f'
          raw = None
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              content = path.read_text(encoding='utf-8')
              blocks = re.findall(r"^[ \t]*cat >> /tmp/hw81-source\.b64 <<'SOURCE_BASE64'\s*\n(.*?)^[ \t]*SOURCE_BASE64\s*$", content, re.M | re.S)
              if not blocks:
                  continue
              candidate = base64.b64decode(''.join(''.join(blocks).split()), validate=True)
              if hashlib.sha256(candidate).hexdigest() == expected:
                  raw = candidate
                  print('Verified v8.1 source:', path)
                  break
          if raw is None:
              raise SystemExit('Original v8.1 workflow not found. Upload this fix to the existing HarmonyWake-v8.1 repository, not an empty repository.')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe source path')
                  if p.parts and p.parts[0] == '.github':
                      continue
                  out = Path(*p.parts)
                  if item.is_dir():
                      out.mkdir(parents=True, exist_ok=True)
                  else:
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(z.read(item))
          PY_RESTORE

      - name: Initialize launch fix payload
        run: ': > /tmp/hw82-fix.b64'

