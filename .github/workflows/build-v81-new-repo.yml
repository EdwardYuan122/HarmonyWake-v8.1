      - name: Verify and unpack complete source
        shell: bash
        run: |
          python3 - <<'PYTHON_SOURCE'
          import base64, hashlib, io, zipfile
          from pathlib import Path, PurePosixPath
          raw=base64.b64decode(''.join(Path('/tmp/hw81-source.b64').read_text().split()),validate=True)
          expected='7df17a0a094d3c2293b1405f0527e3a1845ba7260f9ab3309cd8f36b30c79f3f'
          if hashlib.sha256(raw).hexdigest()!=expected:
              raise SystemExit('Embedded complete-source checksum mismatch')
          root=Path.cwd()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for item in archive.infolist():
                  name=PurePosixPath(item.filename)
                  if name.is_absolute() or '..' in name.parts:
                      raise SystemExit('Unsafe source archive path')
                  # Keep only the workflow actually uploaded by the user.
                  if name.parts and name.parts[0]=='.github':
                      continue
                  destination=root.joinpath(*name.parts)
                  if item.is_dir():
                      destination.mkdir(parents=True,exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      destination.write_bytes(archive.read(item))
          print('Verified and unpacked complete standalone source')
          PYTHON_SOURCE

      - name: Check source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f HarmonyWake-source/settings.gradle
          test -f HarmonyWake-source/app/src/main/AndroidManifest.xml
          test -f tools/ParseJava.java
          test -f tests/ScheduleEngineTest.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test scheduling rules
        run: bash tools/test_schedule.sh

      - name: Check Java syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hw81-parser
          javac -encoding UTF-8 -d /tmp/hw81-parser tools/ParseJava.java
          java -cp /tmp/hw81-parser ParseJava $(find HarmonyWake-source/app/src/main/java -name '*.java')

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build APK
        run: gradle -p HarmonyWake-source assembleDebug --stacktrace --no-daemon

      - name: Prepare candidate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp HarmonyWake-source/app/build/outputs/apk/debug/app-debug.apk deliverables/HarmonyWake-v8.1-candidate-debug.apk
          cp README.md deliverables/README.txt
          (cd deliverables && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyWake-v8.1-APK
          path: deliverables/
          if-no-files-found: error

